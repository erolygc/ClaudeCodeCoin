      roc1: 10
      roc2: 15
      roc3: 20
      roc4: 30

  - name: Awesome_Oscillator
    description: Awesome Oscillator
    params:
      fast: 5
      slow: 34

  - name: Accelerator_Oscillator
    description: Accelerator Oscillator
    params:
      fast: 5
      slow: 34

  - name: Detrended_Price
    description: Detrended Price Oscillator
    params:
      period: 20

  - name: Klinger_Oscillator
    description: Klinger Volume Oscillator
    params:
      fast: 34
      slow: 55
      signal: 13

  - name: Relative_Vigor_Index
    description: Relative Vigor Index
    params:
      period: 10

  - name: PMO
    description: Price Momentum Oscillator
