# TREND INDICATORS (20)
# ============================================================================
trend:
  # Moving Averages
  - name: SMA
    description: Simple Moving Average
    params:
      periods: [5, 10, 20, 50, 100, 200]

  - name: EMA
    description: Exponential Moving Average
    params:
      periods: [9, 12, 20, 26, 50, 100, 200]

  - name: WMA
    description: Weighted Moving Average
    params:
      periods: [10, 20, 50]

  - name: HMA
    description: Hull Moving Average
    params:
      periods: [9, 16, 25]

  - name: VWMA
    description: Volume Weighted Moving Average
    params:
      periods: [20, 50]

  - name: DEMA
    description: Double Exponential Moving Average
    params:
      periods: [20, 50]

  - name: TEMA
    description: Triple Exponential Moving Average
    params:
      periods: [20, 50]

  # MACD Family
  - name: MACD
    description: Moving Average Convergence Divergence
    params:
      fast: 12
      slow: 26
      signal: 9

  - name: MACD_Histogram
    description: MACD Histogram
    params:
      fast: 12
      slow: 26
      signal: 9

  # Directional Movement
  - name: ADX
    description: Average Directional Index
    params:
      period: 14

  - name: DMI
    description: Directional Movement Index
    params:
      period: 14

  - name: Aroon
    description: Aroon Indicator
    params:
      period: 25

  - name: Aroon_Oscillator
    description: Aroon Oscillator
    params:
      period: 25

  # Other Trend
  - name: Parabolic_SAR
    description: Parabolic Stop and Reverse
    params:
      acceleration: 0.02
      maximum: 0.2

  - name: Supertrend
    description: Supertrend Indicator
    params:
      period: 10
      multiplier: 3.0

  - name: Ichimoku
    description: Ichimoku Cloud
    params:
      tenkan: 9
      kijun: 26
      senkou_b: 52

  - name: Linear_Regression
    description: Linear Regression Line
    params:
      period: 14

  - name: TRIX
    description: Triple Exponential Average
    params:
      period: 14

  - name: Choppiness_Index
    description: Choppiness Index
    params:
      period: 14

  - name: ZigZag
    description: ZigZag Indicator
    params:
      deviation: 5.0

# MOMENTUM INDICATORS (25)
# ============================================================================
momentum:
  # RSI Family
  - name: RSI
    description: Relative Strength Index
    params:
      periods: [7, 14, 21]

  - name: Stochastic_RSI
    description: Stochastic RSI
    params:
      rsi_period: 14
      stoch_period: 14
      k: 3
      d: 3

  # Stochastic
  - name: Stochastic
    description: Stochastic Oscillator
    params:
      k_period: 14
      d_period: 3
      smooth_k: 3

  - name: Stochastic_Fast
    description: Fast Stochastic
    params:
      k_period: 5
      d_period: 3

  # Williams
  - name: Williams_R
    description: Williams %R
    params:
      period: 14

  # CCI
  - name: CCI
    description: Commodity Channel Index
    params:
      period: 20

  # ROC Family
  - name: ROC
    description: Rate of Change
    params:
      periods: [5, 10, 20]

  - name: ROCP
    description: Rate of Change Percentage
    params:
      period: 10

  - name: ROCR
    description: Rate of Change Ratio
    params:
      period: 10

  # Momentum
  - name: MOM
    description: Momentum
    params:
      period: 10

  - name: CMO
    description: Chande Momentum Oscillator
    params:
      period: 14

  # Advanced Momentum
  - name: Ultimate_Oscillator
